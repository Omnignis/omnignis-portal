name: Send livestream reports

on:
  schedule:
    # Hourly. Each church now has its own timezone and send hour, so the job has
    # to wake up every hour and let report.py decide who is due. is_due() asks
    # "has the scheduled moment passed and have we not sent for it yet", so a
    # delayed or skipped run catches up on the next pass and cannot double-send.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      profile_id:
        description: "Single profile id to report on. Leave blank for the normal sweep of all due churches."
        required: false
        default: ""
      mode:
        description: "latest = most recent livestream only. scheduled = normal window for that church."
        required: false
        default: "scheduled"
        type: choice
        options:
          - scheduled
          - latest

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r report/requirements.txt
      - run: python report/report.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          GRAPH_API_VERSION: v21.0
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM_EMAIL: reports@send.omnignis.com
          # Empty on scheduled runs. Set by the portal for an on-demand report.
          ONLY_PROFILE_ID: ${{ github.event.inputs.profile_id }}
          REPORT_MODE: ${{ github.event.inputs.mode }}
